name: Update Battery Notes database

on:
  schedule:
    - cron: '0 8 * * 1'  # Mondays at 8am UTC, 2h after HA-Battery-Notes fork sync
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download latest library.json from fork
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/smcneece/HA-Battery-Notes/main/library/library.json" \
            -o addon/app/library.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add addon/app/library.json
          if git diff --cached --quiet; then
            echo "No changes to library.json, skipping commit"
          else
            git commit -m "chore: update Battery Notes database"
            git push
          fi
